<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BELIFT LAB</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <!-- loader -->
    <div class="bg-loader">
        <div class="loader"></div>
    </div>

    <!-- header -->
    <header>
        <div class="container">
            <h1><a href="index.html">BE:LIFT LAB</a></h1>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="enhypen.html">ENHYPEN</a></li>
                <li><a href="illit.html">ILLIT</a></li>
            </ul>
        </div>
    </header>

    <!-- login section -->
    <section class="login-section">
        <div class="login-container">
            <h2>Login to BELIFT LAB</h2>
            <form id="loginForm" action="auth/login.php" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
                <div class="register-link">
                    <p>Don't have an account? <a href="auth/register.php">Register here</a></p>
                </div>
            </form>
        </div>
    </section>

    <!-- footer -->
    <footer>
        <div class="container">
            <small>Copyright &copy; 2024 - Belift Label. All Right Reserved</small>
        </div>
    </footer>

    <script>
        $(document).ready(function(){
            $(".bg-loader").hide();
            
            $("#loginForm").on('submit', function(e) {
                e.preventDefault();
                
                $.ajax({
                    type: "POST",
                    url: "auth/login.php",
                    data: $(this).serialize(),
                    dataType: 'json',
                    beforeSend: function() {
                        Swal.fire({
                            title: 'Logging in...',
                            text: 'Please wait',
                            allowOutsideClick: false,
                            didOpen: () => {
                                Swal.showLoading();
                            }
                        });
                    },
                    success: function(response) {
                        if (response.success) {
                            Swal.fire({
                                icon: 'success',
                                title: 'Login successful!',
                                text: 'Welcome to BELIFT LAB'
                            }).then(() => {
                                window.location.href = 'indexhome.html';
                            });
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Login failed!',
                                text: response.message
                            });
                        }
                    },
                    error: function() {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: 'Something went wrong. Please try again.'
                        });
                    }
                });
            });
        });
    </script>   

    <style>
        .error {
            color: red;
            font-size: 0.8em;
            margin-top: 5px;
            display: block;
        }
        
        /* Custom styling for SweetAlert */
        .my-swal {
            z-index: 9999;
        }
    </style>
</body>
</html>
